name: career-milvus

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    platform: linux/amd64
    container_name: career-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - milvus_etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: career-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - milvus_minio_data:/data

  standalone:
    image: milvusdb/milvus:v2.5.14
    platform: linux/amd64
    container_name: milvus-standalone
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    command:
      - milvus
      - run
      - standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MQ_TYPE: rocksmq
    volumes:
      - milvus_data:/var/lib/milvus
    # 只发布到回环地址。Milvus 默认 authorizationEnabled=false，一旦绑定 0.0.0.0，
    # 同网段任何主机都能绕过 FastAPI 的登录与 owner_id 过滤，直接读写含正文和归属的向量集合。
    # 后端在本机运行时直接连 127.0.0.1；与后端同网部署时删除 ports 段，走 compose 内部网络。
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9091/healthz
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  milvus_etcd_data:
    name: career_milvus_etcd_data
  milvus_minio_data:
    name: career_milvus_minio_data
  milvus_data:
    name: career_milvus_data
