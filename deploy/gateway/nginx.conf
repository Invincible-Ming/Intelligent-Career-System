worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # The HTTPS tunnel terminates TLS; retain HTTPS for host-only Secure cookies.
    map $http_x_forwarded_proto $public_scheme {
        default $scheme;
        https https;
    }

    server {
        listen 8080;
        client_max_body_size 32m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;

        # Only these browser-facing backend routes are exposed by this gateway.
        location ~ ^/api/auth/browser-(login|logout)$ {
            proxy_pass http://host.docker.internal:8000;
        }
        location = /pricing {
            proxy_pass http://host.docker.internal:8000;
        }
        location /brand/ {
            proxy_pass http://host.docker.internal:8000;
        }
        # Native mini-program clients use bearer sessions. Keep the public
        # surface explicit; evaluation/admin/config APIs stay inaccessible.
        location ~ ^/mini-api/(auth/(options|login|register|me|logout|usage)|credits/(me|check-in|entries)|chat/(conversations(/[0-9a-f-]+(/(messages|update))?)?|completions)|documents(/upload|/[0-9a-f-]+(/(text|download|retry|rename))?)?|knowledge/(provider|status|items)|search/hybrid|runs(/[0-9a-f-]+)?|mobile/jobs(/[0-9a-f-]+)?)$ {
            rewrite ^/mini-api/(.*)$ /api/$1 break;
            proxy_pass http://host.docker.internal:8000;
        }
        location /mini-api/ { return 404; }
        location /api/ { return 404; }

        # Includes Streamlit assets, file uploads and its WebSocket connection.
        location / {
            proxy_pass http://host.docker.internal:8501;
        }
    }
}
