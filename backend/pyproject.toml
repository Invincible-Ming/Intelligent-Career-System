[project]
name = "intelligent-career-system-backend"
version = "1.0.0"
description = "智能求职 Multi-Agent 系统后端"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 收集阶段即导入整个 app 包；缺可选中间件客户端时给出明确跳过原因，
# 而不是让 8 个测试文件一起报 ModuleNotFoundError。
addopts = "-ra --strict-markers"
# pytest-asyncio：显式声明 strict 模式，异步用例需自带 @pytest.mark.asyncio。
# 插件由 requirements-test.txt 安装；缺失时 --strict-markers 会在收集阶段报错。
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".local",
    "__pycache__",
    "models",
    "evaluation_reports",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # bandit
]
ignore = [
    "E501",    # 行宽由 formatter 控制
    "B008",    # FastAPI Depends() 惯用法
    "S101",    # 测试中允许 assert
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC", "E402"]
"deploy/*" = ["S", "ASYNC", "E402"]
"scripts/*" = ["S", "ASYNC", "E402"]  # CLI 需先设置项目导入路径
