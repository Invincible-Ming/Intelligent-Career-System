name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装 ruff
        run: pip install ruff==0.6.9

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check --diff . || true  # 格式问题仅提示，不阻塞

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装测试依赖
        run: |
          pip install -r requirements.txt
          pip install pytest==8.4.2

      - name: 语法编译检查
        run: |
          python -m compileall -q app scripts ../deploy

      - name: 导入一致性检查
        # 编译通过 ≠ 导入成立。from X import Y 若 Y 不存在，
        # 只有真正 import 时才会炸——由 tests/test_static_imports.py 守住。
        run: pytest tests/test_static_imports.py -q

      - name: 运行测试
        # 未配置中间件时相关模块会被 conftest 收集阶段跳过；
        # 这里只要求「不崩溃、不失败」。
        run: pytest -q --tb=short

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法检查
        run: |
          python -m py_compile app.py
          python -m py_compile career_ui/*.py

      - name: 导入检查（确保无循环依赖）
        run: python -c "import career_ui.api, career_ui.endpoints, career_ui.render, career_ui.session, career_ui.config"

      - name: 未定义名称静态检查
        # 拆分重构后最常见的坑：模块级常量忘了导入。
        # py_compile 抓不到，ruff F821 能抓到。
        run: |
          pip install ruff==0.6.9
          ruff check --select F821 app.py career_ui/
