name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装 ruff
        run: pip install ruff==0.6.9

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check --diff . || true  # 格式问题仅提示，不阻塞

  test:
    name: 单元与集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: career_ci
          POSTGRES_PASSWORD: career_ci_test
          POSTGRES_DB: career_ci_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U career_ci -d career_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CAREER_TEST_DATABASE_URL: postgresql+asyncpg://career_ci:career_ci_test@127.0.0.1:15432/career_ci_test
      CAREER_TEST_REDIS_URL: redis://127.0.0.1:16379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
            frontend/requirements.txt

      - name: 安装测试依赖
        # 后端运行时 + 前端 UI 依赖（backend/tests/test_frontend_*.py 导入 career_ui，
        # 这些模块会 import streamlit）+ pytest 与 pytest-asyncio（--strict-markers
        # 需要 asyncio marker 已被注册，否则收集阶段直接失败）。
        run: pip install -r requirements-test.txt

      - name: 语法编译检查
        run: |
          python -m compileall -q app scripts ../deploy

      - name: 导入一致性检查
        # 编译通过 ≠ 导入成立。from X import Y 若 Y 不存在，
        # 只有真正 import 时才会炸——由 tests/test_static_imports.py 守住。
        run: pytest tests/test_static_imports.py -q

      - name: 运行测试
        # Redis 缓存与 PostgreSQL 鉴权测试使用本 job 的临时服务。
        # 模型、对象存储及向量库调用由各测试模拟，不使用真实凭据。
        run: pytest -q --tb=short

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法检查
        run: |
          python -m py_compile app.py
          python -m py_compile career_ui/*.py

      - name: 导入检查（确保无循环依赖）
        run: python -c "import career_ui.api, career_ui.endpoints, career_ui.render, career_ui.session, career_ui.config"

      - name: 未定义名称静态检查
        # 拆分重构后最常见的坑：模块级常量忘了导入。
        # py_compile 抓不到，ruff F821 能抓到。
        run: |
          pip install ruff==0.6.9
          ruff check --select F821 app.py career_ui/
